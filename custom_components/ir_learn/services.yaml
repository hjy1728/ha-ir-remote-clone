add_button:
  fields:
    config_entry_id:
      required: false
      example: "01J8ZQ7K9M"
      selector:
        text:
    name:
      required: false
      example: "电视-电源"
      description: "单个按键名称（兼容旧用法）"
      selector:
        text:
    names:
      required: false
      example: ["电视-电源", "电视-音量+", "空调-开关"]
      description: "一次添加多个按键名称"
      selector:
        text:
          multiple: true

delete_button:
  fields:
    config_entry_id:
      required: false
      example: "01J8ZQ7K9M"
      selector:
        text:
    name:
      required: false
      example: "电视-电源"
      description: "单个按键名称（兼容旧用法）"
      selector:
        text:
    names:
      required: false
      example: ["电视-电源", "电视-音量+"]
      description: "一次删除多个按键，实体会同步移除"
      selector:
        text:
          multiple: true

send_button:
  fields:
    config_entry_id:
      required: false
      example: "01J8ZQ7K9M"
      selector:
        text:
    name:
      required: true
      example: "电视-电源"
      selector:
        text:

clear_buffer:
  fields:
    config_entry_id:
      required: false
      example: "01J8ZQ7K9M"
      selector:
        text:

receive_code:
  fields:
    code:
      required: true
      example: "pronto:0000 006D 0012 0000 ..."
      selector:
        text:
    repeats:
      required: false
      example: 6
      selector:
        number:
          min: 1
          max: 10
          mode: box
    pulses:
      required: false
      example: 18
      selector:
        number:
          min: 1
          mode: box
    config_entry_id:
      required: false
      example: "01J8ZQ7K9M"
      selector:
        text:
